[pytest]
DJANGO_SETTINGS_MODULE = reservation_project.settings.local
python_files = tests/test_*.py
python_classes = Test*
python_functions = test_*
markers =
    blockchain: tests que requieren RPC real (solo en CI con secrets)
    slow: tests lentos (>1 segundo)
    postgres: tests que requieren PostgreSQL (race conditions con select_for_update)
